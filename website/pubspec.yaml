name: zaspr_site
description: Site officiel de ZASPR Kit, construit avec Jaspr et stylé uniquement avec JX CSS.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.22.4
  jaspr_router: ^0.8.1
  universal_web: ^1.1.1
  # Le bac à sable et la référence utilisent directement le framework.
  jx_core: ^0.1.0
  jx_engine: ^0.1.0
  jx_parser: ^0.1.0
  jx_rules: ^0.1.0
  jx_theme: ^0.1.0

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: 4.8.0
  jaspr_builder: ^0.22.4
  jx_cli: ^0.1.0
  lints: ^5.0.0

jaspr:
  mode: static
