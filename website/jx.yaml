# Configuration JX CSS du site officiel.
content:
  - lib

extensions: [dart]

# Servi par Jaspr comme fichier statique (web/ -> racine du site).
output: web/jx.css
minify: false
reset: true

# Identité : base graphite neutre, bleu de marque, et la syntaxe JX
# comme palette d'accent (variant, ident, value, bang).
theme:
  extend:
    colors:
      abyss: '#0B0D12'
      deep: '#12161E'
      shelf: '#1A1F2A'
      edge: 'rgba(255,255,255,0.08)'
      snow: '#F2F4F8'
      haze: '#9BA4B4'
      brand: '#3B6CF0'
      beam: '#7EA2FF'
      variant: '#FFB547'
      ident: '#2DD4BF'
      value: '#7DD3FC'
      bang: '#FB7185'
    font-family:
      text: 'ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'
      code: 'ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace'
