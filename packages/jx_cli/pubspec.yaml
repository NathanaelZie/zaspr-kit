name: jx_cli
description: "JX CSS for Jaspr in one package: utility-first CSS compiler, CLI with watch mode, build_runner builder, Tailwind migration and accessible UI components."
version: 0.0.3
repository: https://github.com/NathanaelZie/zaspr-kit/tree/main/packages/jx_cli
issue_tracker: https://github.com/NathanaelZie/zaspr-kit/issues
topics:
  - css
  - cli
  - jaspr
  - utility-first
  - ui

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  args: ^2.5.0
  build: ^4.0.0
  glob: ^2.1.1
  jaspr: ^0.22.4
  path: ^1.9.0
  universal_web: ^1.1.0
  yaml: ^3.1.4

dev_dependencies:
  build_test: ^3.3.0
  lints: ^6.0.0
  test: ^1.25.6

executables:
  jx: jx
