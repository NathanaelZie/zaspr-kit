name: jx_cli
description: "JX CSS command line: extracts utility classes from your Dart files and generates a minimal stylesheet, with watch mode. Built for Jaspr."
version: 0.2.1
repository: https://github.com/NathanaelZie/zaspr-kit/tree/main/packages/jx_cli
issue_tracker: https://github.com/NathanaelZie/zaspr-kit/issues
topics:
  - css
  - cli
  - jaspr
  - utility-first

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  args: ^2.5.0
  jx_core: ^0.2.1
  jx_engine: ^0.2.1
  jx_parser: ^0.2.1
  jx_theme: ^0.2.1
  path: ^1.9.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  jx: jx
