name: jx_cli
description: "CLI de JX CSS : extrait les classes utilitaires de vos fichiers Dart et génère une feuille de style minimale, avec mode watch."
version: 0.1.0
repository: https://github.com/NathanaelZie/zaspr-kit/tree/main/packages/jx_cli
issue_tracker: https://github.com/NathanaelZie/zaspr-kit/issues
topics:
  - css
  - cli
  - jaspr
  - utility-first

environment:
  sdk: ^3.10.7

resolution: workspace

dependencies:
  args: ^2.5.0
  jx_core: ^0.1.0
  jx_engine: ^0.1.0
  jx_parser: ^0.1.0
  jx_theme: ^0.1.0
  path: ^1.9.0
  yaml: ^3.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

executables:
  jx: jx
